<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Navigation Header -->
<div th:fragment="header">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">
                <i class="bi bi-briefcase"></i> Job Board
            </a>
            <div class="navbar-nav">
                <a class="nav-link" th:href="@{/companies}">Companies</a>
                <a class="nav-link" th:href="@{/jobs}">Job Postings</a>
            </div>
        </div>
    </nav>
</div>

<!-- Page Header with parameters -->
<div th:fragment="page-header(title, showCreateButton, createUrl)">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 th:text="${title}">Page Title</h1>
        <div th:if="${showCreateButton}">
            <a th:href="@{${createUrl}}" class="btn btn-primary">
                <i class="bi bi-plus-circle"></i> Add New
            </a>
        </div>
    </div>
</div>
</body>
</html>
