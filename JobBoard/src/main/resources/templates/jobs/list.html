<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::main})}"
      lang="en">
<head>
    <title>Job Postings - Job Board</title>
</head>
<body>
<main th:fragment="main">
    <!-- ========================================
         PAGE HEADER
         ======================================== -->
    <div th:replace="~{fragments/header :: page-header(
            title='Job Postings',
            showCreateButton=true,
            createUrl='/jobs/new'
        )}"></div>

    <!-- ========================================
         SEARCH FORM
         ======================================== -->
    <div class="card mb-4" style="background: linear-gradient(135deg, #667eea15, #764ba215); border: none;">
        <div class="card-body">
            <form th:action="@{/jobs}" method="get" class="row g-3">
                <div class="col-md-9">
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0">
                            <i class="bi bi-search"></i>
                        </span>
                        <input type="text"
                               name="keyword"
                               class="form-control border-start-0 ps-0"
                               th:value="${keyword}"
                               placeholder="Search jobs by title, company, location..."
                               aria-label="Search jobs">
                    </div>
                </div>
                <div class="col-md-3">
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="bi bi-search"></i>
                        <span>Search</span>
                    </button>
                </div>
                <div class="col-12" th:if="${keyword}">
                    <div class="d-flex align-items-center gap-2">
                        <a th:href="@{/jobs}" class="btn btn-outline-secondary btn-sm">
                            <i class="bi bi-x-circle"></i>
                            <span>Clear Search</span>
                        </a>
                        <span class="text-muted">
                            Searching for: "<strong th:text="${keyword}"></strong>"
                        </span>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- ========================================
         EMPTY STATE
         ======================================== -->
    <div th:if="${#lists.isEmpty(jobs)}" class="empty-state">
        <div class="mb-4">
            <i class="bi bi-inbox"></i>
        </div>
        <h3 class="text-muted">No Jobs Found</h3>
        <p class="text-muted" th:if="${keyword}">
            No results for "<span th:text="${keyword}"></span>". Try different keywords or clear your search.
        </p>
        <p class="text-muted" th:unless="${keyword}">
            Start by creating your first job posting
        </p>
        <a th:href="@{/jobs/new}" class="btn btn-primary mt-3">
            <i class="bi bi-plus-circle-fill"></i>
            <span>Create First Job</span>
        </a>
    </div>

    <!-- ========================================
         JOB CARDS GRID
         ======================================== -->
    <div th:unless="${#lists.isEmpty(jobs)}">
        <div class="row g-4">
            <div th:each="job : ${jobs}" class="col-lg-6">
                <div class="card h-100">
                    <div class="card-body d-flex flex-column">
                        <!-- Job Title and Company -->
                        <div class="mb-3">
                            <h5 class="card-title mb-2">
                                <a th:href="@{/jobs/detail/{id}(id=${job.id})}"
                                   th:text="${job.title}"
                                   class="text-decoration-none text-dark fw-bold"
                                   title="View job details">
                                    Job Title
                                </a>
                            </h5>
                            <div class="d-flex align-items-center text-muted mb-2">
                                <i class="bi bi-building me-2"></i>
                                <h6 class="mb-0" th:text="${job.company.name}">Company Name</h6>
                            </div>
                        </div>

                        <!-- Job Description -->
                        <p class="card-text text-muted mb-3 flex-grow-1"
                           th:text="${#strings.abbreviate(job.description, 150)}"
                           style="line-height: 1.6;">
                            Job description preview
                        </p>

                        <!-- Job Badges -->
                        <div class="mb-3">
                            <span class="badge bg-primary me-2">
                                <i class="bi bi-briefcase-fill"></i>
                                <span th:text="${job.jobType.displayName}">Job Type</span>
                            </span>
                            <span class="badge bg-secondary me-2">
                                <i class="bi bi-geo-alt-fill"></i>
                                <span th:text="${job.location}">Location</span>
                            </span>
                            <span th:if="${job.salary}" class="badge bg-success">
                                <i class="bi bi-cash"></i>
                                <span th:text="${job.salary}">Salary</span>
                            </span>
                        </div>

                        <!-- Footer with Date and Actions -->
                        <div class="d-flex justify-content-between align-items-center pt-3 border-top">
                            <small class="text-muted">
                                <i class="bi bi-calendar3"></i>
                                <span th:text="${#temporals.format(job.postedDate, 'MMM dd, yyyy')}">Date</span>
                            </small>
                            <div class="btn-group btn-group-sm" role="group" aria-label="Job actions">
                                <a th:href="@{/jobs/detail/{id}(id=${job.id})}"
                                   class="btn btn-outline-secondary"
                                   title="View Details"
                                   data-bs-toggle="tooltip"
                                   data-bs-placement="top">
                                    <i class="bi bi-eye-fill"></i>
                                </a>
                                <a th:href="@{/jobs/edit/{id}(id=${job.id})}"
                                   class="btn btn-outline-primary"
                                   title="Edit Job"
                                   data-bs-toggle="tooltip"
                                   data-bs-placement="top">
                                    <i class="bi bi-pencil-fill"></i>
                                </a>
                                <a th:href="@{/jobs/delete/{id}(id=${job.id})}"
                                   class="btn btn-outline-danger"
                                   onclick="return confirmDelete('Are you sure you want to delete this job posting?')"
                                   title="Delete Job"
                                   data-bs-toggle="tooltip"
                                   data-bs-placement="top">
                                    <i class="bi bi-trash-fill"></i>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Results Count -->
        <div class="mt-4 text-center text-muted">
            <small>
                <i class="bi bi-info-circle"></i>
                Showing <strong th:text="${#lists.size(jobs)}">0</strong> job posting(s)
                <span th:if="${keyword}"> for "<strong th:text="${keyword}"></strong>"</span>
            </small>
        </div>
    </div>
</main>
</body>
</html>
