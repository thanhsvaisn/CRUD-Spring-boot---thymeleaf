<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::main})}">
<head>
    <title th:text="${jobPosting.id != null} ? 'Edit Job' : 'Create Job'">Job Form</title>
</head>
<body>
<main th:fragment="main">
    <div class="row justify-content-center">
        <div class="col-md-10">
            <div class="card">
                <div class="card-header">
                    <h4 th:text="${jobPosting.id != null} ? 'Edit Job Posting' : 'Create New Job Posting'"
                        class="mb-0">Job Form</h4>
                </div>
                <div class="card-body">
                    <form th:object="${jobPosting}" th:action="@{${formAction}}" method="post">

                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="title" class="form-label">Job Title *</label>
                                    <input type="text" class="form-control" id="title" th:field="*{title}"
                                           placeholder="Enter job title">
                                    <div th:if="${#fields.hasErrors('title')}" class="text-danger">
                                        <small th:errors="*{title}">Title error</small>
                                    </div>
                                </div>
                            </div>

                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="company" class="form-label">Company *</label>
                                    <select class="form-select" id="company" name="companyId">
                                        <option value="">Select a company</option>
                                        <option th:each="company : ${companies}"
                                                th:value="${company.id}"
                                                th:text="${company.name}"
                                                th:selected="${jobPosting.company != null && jobPosting.company.id == company.id}">
                                        </option>
                                    </select>
                                    <div th:if="${#fields.hasErrors('company')}" class="text-danger">
                                        <small th:errors="*{company}">Company error</small>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-4">
                                <div class="mb-3">
                                    <label for="jobType" class="form-label">Job Type *</label>
                                    <select class="form-select" id="jobType" th:field="*{jobType}">
                                        <option value="">Select job type</option>
                                        <option th:each="type : ${jobTypes}"
                                                th:value="${type}"
                                                th:text="${type.displayName}">
                                        </option>
                                    </select>
                                    <div th:if="${#fields.hasErrors('jobType')}" class="text-danger">
                                        <small th:errors="*{jobType}">Job type error</small>
                                    </div>
                                </div>
                            </div>

                            <div class="col-md-4">
                                <div class="mb-3">
                                    <label for="location" class="form-label">Location *</label>
                                    <input type="text" class="form-control" id="location" th:field="*{location}"
                                           placeholder="Enter job location">
                                    <div th:if="${#fields.hasErrors('location')}" class="text-danger">
                                        <small th:errors="*{location}">Location error</small>
                                    </div>
                                </div>
                            </div>

                            <div class="col-md-4">
                                <div class="mb-3">
                                    <label for="salary" class="form-label">Salary</label>
                                    <input type="text" class="form-control" id="salary" th:field="*{salary}"
                                           placeholder="e.g., $50,000 - $70,000">
                                </div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label">Job Description *</label>
                            <textarea class="form-control" id="description" th:field="*{description}" rows="6"
                                      placeholder="Enter detailed job description"></textarea>
                            <div th:if="${#fields.hasErrors('description')}" class="text-danger">
                                <small th:errors="*{description}">Description error</small>
                            </div>
                        </div>

                        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                            <a th:href="@{/jobs}" class="btn btn-secondary me-md-2">Cancel</a>
                            <button type="submit" class="btn btn-primary">
                                <span th:text="${jobPosting.id != null} ? 'Update' : 'Create'">Save</span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
