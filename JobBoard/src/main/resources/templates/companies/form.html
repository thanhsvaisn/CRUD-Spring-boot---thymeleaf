<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::main})}">
<head>
    <title th:text="${company.id != null} ? 'Edit Company' : 'Create Company'">Company Form</title>
</head>
<body>
<main th:fragment="main">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h4 th:text="${company.id != null} ? 'Edit Company' : 'Create New Company'" class="mb-0">
                        Company Form
                    </h4>
                </div>
                <div class="card-body">
                    <!-- Solution 1: Single line conditional URL -->
                    <form th:object="${company}" th:action="@{${formAction}}" method="post">

                        <div class="mb-3">
                            <label for="name" class="form-label">Company Name *</label>
                            <input type="text" class="form-control" id="name" th:field="*{name}"
                                   placeholder="Enter company name">
                            <div th:if="${#fields.hasErrors('name')}" class="text-danger">
                                <small th:errors="*{name}">Name error</small>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="address" class="form-label">Address *</label>
                            <textarea class="form-control" id="address" th:field="*{address}" rows="3"
                                      placeholder="Enter company address"></textarea>
                            <div th:if="${#fields.hasErrors('address')}" class="text-danger">
                                <small th:errors="*{address}">Address error</small>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">Email *</label>
                            <input type="email" class="form-control" id="email" th:field="*{email}"
                                   placeholder="Enter company email">
                            <div th:if="${#fields.hasErrors('email')}" class="text-danger">
                                <small th:errors="*{email}">Email error</small>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="website" class="form-label">Website</label>
                            <input type="url" class="form-control" id="website" th:field="*{website}"
                                   placeholder="https://example.com">
                            <div th:if="${#fields.hasErrors('website')}" class="text-danger">
                                <small th:errors="*{website}">Website error</small>
                            </div>
                        </div>

                        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                            <a th:href="@{/companies}" class="btn btn-secondary me-md-2">Cancel</a>
                            <button type="submit" class="btn btn-primary">
                                <span th:text="${company.id != null} ? 'Update' : 'Create'">Save</span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
