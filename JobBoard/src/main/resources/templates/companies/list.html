<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>Companies</title>
</head>
<body>
<main th:fragment="main">
    <!-- Pass parameters to header fragment -->
    <div th:replace="~{fragments/header :: page-header(
            title='Companies',
            showCreateButton=true,
            createUrl='/companies/new'
        )}"></div>

    <!-- Corrected empty check -->
    <div th:if="${#lists.isEmpty(companies)}" class="alert alert-info">
        <i class="bi bi-info-circle"></i> No companies found.
        <a th:href="@{/companies/new}" class="alert-link">Create the first company</a>.
    </div>

    <div th:unless="${#lists.isEmpty(companies)}" class="table-responsive">
        <table class="table table-striped table-hover">
            <thead class="table-dark">
            <tr>
                <th>#</th>
                <th>Company Name</th>
                <th>Address</th>
                <th>Email</th>
                <th>Website</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="company, iterStat : ${companies}">
                <td th:text="${iterStat.count}">1</td>
                <td th:text="${company.name}">Company Name</td>
                <td th:text="${company.address}">Address</td>
                <td>
                    <a th:href="'mailto:' + ${company.email}"
                       th:text="${company.email}">email@company.com</a>
                </td>
                <td>
                    <a th:if="${company.website}"
                       th:href="${company.website}"
                       target="_blank"
                       th:text="${company.website}">Website</a>
                    <span th:unless="${company.website}" class="text-muted">N/A</span>
                </td>
                <td>
                    <a th:href="@{/companies/edit/{id}(id=${company.id})}"
                       class="btn btn-sm btn-outline-primary">
                        <i class="bi bi-pencil"></i> Edit
                    </a>
                    <a th:href="@{/companies/delete/{id}(id=${company.id})}"
                       class="btn btn-sm btn-outline-danger"
                       onclick="return confirmDelete('Are you sure you want to delete this company?')">
                        <i class="bi bi-trash"></i> Delete
                    </a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
